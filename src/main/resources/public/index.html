<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudavelmente - Assinatura</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

<div class="max-w-3xl w-full bg-white rounded-2xl shadow-lg p-6 md:p-8">
    <div class="text-center mb-8">
        <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full">Plano Premium</span>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mt-2">Saudavelmente</h1>
        <p class="text-slate-500 mt-1">Escolha seu plano.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nome completo</label>
            <input id="nome" type="text" value="" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
            <input id="email" type="email" value="email@exemplo.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
    </div>

    <div id="produtos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <p class="text-slate-400 text-sm">Carregando planos...</p>
    </div>

    <div id="pix-container" class="hidden border-t border-slate-200 pt-6 text-center">
        <div id="status-badge" class="inline-flex items-center gap-2 bg-amber-100 text-amber-800 text-sm font-medium px-4 py-1.5 rounded-full mb-4">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
            Aguardando pagamento Pix...
        </div>

        <div class="flex justify-center mb-4">
            <img id="qr-code-img" src="" alt="QR Code Pix" class="w-52 h-52 border border-slate-200 rounded-xl p-2 bg-white">
        </div>

        <label class="block text-xs font-medium text-slate-500 mb-1">Pix Copia e Cola</label>
        <div class="flex gap-2 max-w-md mx-auto">
            <input id="pix-copia-cola" type="text" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-600">
            <button onclick="copiarPix()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium px-4 py-2 rounded-lg transition">
                Copiar
            </button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
